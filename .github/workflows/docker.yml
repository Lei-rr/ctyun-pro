name: build-and-publish

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: npm ci

      - name: Build Web & Embedded Assets
        run: |
          npm --workspace web run build
          npx tsx scripts/build-embedded.ts

      - name: Compile Standalone Binaries
        run: |
          mkdir -p release-bin
          bun build --compile src/index.ts --outfile release-bin/ctyun-pro-linux-amd64
          bun build --compile --target=bun-linux-arm64 src/index.ts --outfile release-bin/ctyun-pro-linux-arm64
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile release-bin/ctyun-pro-windows-x64.exe
          chmod +x release-bin/ctyun-pro-linux*

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bin/ctyun-pro-linux-amd64
            release-bin/ctyun-pro-linux-arm64
            release-bin/ctyun-pro-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
