name: build-and-publish

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: npm ci

      - name: Build Web & Embedded Assets
        run: |
          npm --workspace web run build
          npx tsx scripts/build-embedded.ts

      - name: Compile Standalone Binaries
        run: |
          mkdir -p release-bin
          bun build --compile src/index.ts --outfile release-bin/ctyun-pro-linux-amd64
          bun build --compile --target=bun-linux-arm64 src/index.ts --outfile release-bin/ctyun-pro-linux-arm64
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile release-bin/ctyun-pro-windows-x64.exe
          chmod +x release-bin/ctyun-pro-linux*

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bin/ctyun-pro-linux-amd64
            release-bin/ctyun-pro-linux-arm64
            release-bin/ctyun-pro-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          ALIYUN_USER="$(echo -n "${ALIYUN_USERNAME:-guoleipro}" | xargs)"
          ALIYUN_PWD="$(echo -n "$ALIYUN_PASSWORD" | tr -d '\r\n')"
          if [ -n "$ALIYUN_PWD" ]; then
            echo "Aliyun ACR auth attempt: user_len=${#ALIYUN_USER}, pwd_len=${#ALIYUN_PWD}"
            if echo "$ALIYUN_PWD" | docker login --username "$ALIYUN_USER" --password-stdin crpi-kbafcu5p49r7b1k1.cn-hangzhou.personal.cr.aliyuncs.com; then
              echo "ALIYUN_LOGGED_IN=true" >> $GITHUB_ENV
              echo "Successfully logged into Aliyun ACR as $ALIYUN_USER"
            elif echo "$ALIYUN_PWD" | docker login --username "$ALIYUN_USER" --password-stdin registry.cn-hangzhou.aliyuncs.com; then
              echo "ALIYUN_LOGGED_IN=true" >> $GITHUB_ENV
              echo "Successfully logged into Aliyun ACR (standard endpoint) as $ALIYUN_USER"
            else
              echo "::warning::Aliyun ACR login failed with user $ALIYUN_USER. Please verify ACR 访问凭证密码."
            fi
          else
            echo "ALIYUN_PASSWORD is not set, skipping Aliyun ACR push."
          fi

      - name: Determine Image Repositories
        id: repos
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          # 规则：仅当发布正式版本（Tag: v*）时，才推送到阿里云 ACR 镜像；日常 dev 分支不推阿里云
          if [ "$ALIYUN_LOGGED_IN" = "true" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IMAGES="${IMAGES}"$'\n'"crpi-kbafcu5p49r7b1k1.cn-hangzhou.personal.cr.aliyuncs.com/lei-rr/ctyun-pro"
            echo "Release tag detected: Push target includes Aliyun ACR."
          else
            echo "Non-release build or Aliyun not logged in: Skipping Aliyun ACR push."
          fi
          echo "images<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repos.outputs.images }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
